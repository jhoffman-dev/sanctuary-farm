# CI (SF-39): the same checks an agent runs locally, on every PR and on main.
# Three parallel jobs so a red e2e or rules run does not hide a red gate.
# Actions are pinned to commit SHAs (Dependabot's github-actions group bumps
# them); pnpm's version comes from `packageManager` in the root package.json.
name: CI

on:
  # No branch filter: stacked PRs whose base is another feature branch run too.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck · lint · boundaries · tests + coverage · functions tests · build
      - run: pnpm gate

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages ship TS source, so the web app's Playwright webServer
      # builds it itself; no separate `pnpm build` is needed here.
      - run: pnpm --filter @sf/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/landing/playwright-report
            apps/landing/test-results
          if-no-files-found: ignore
          retention-days: 7

  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Firestore emulator is a Java program (see firestore/README.md).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # `test:rules` shells out to the `firebase` CLI, which is not a repo
      # dependency; pin it to the version used locally.
      - run: npm install --global firebase-tools@15.28.2
      - run: pnpm test:rules

  # SF-93 / ADR-0006: the Godot client in game/. Not a required check yet —
  # James decides once it has been stable for a while.
  godot:
    name: godot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The editor binary only. The web export template is Sanctuary Farm's own
      # size-optimised build (SF-100), fetched by `pnpm godot:export:web` from
      # the release named in game/tools/web_template.lock.
      - id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot-bin
          key: godot-${{ env.GODOT_VERSION }}-stable-linux-editor-v2
      - name: Install Godot ${{ env.GODOT_VERSION }} (checksum verified)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot-download" && cd "$RUNNER_TEMP/godot-download"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          curl -fsSLO "$base/$editor"
          grep -E " ${editor}\$" SHA512-SUMS.txt > expected.sha512
          test "$(wc -l < expected.sha512)" -eq 1
          sha512sum --check --strict expected.sha512
          mkdir -p "$GITHUB_WORKSPACE/.godot-bin"
          unzip -q "$editor" -d "$GITHUB_WORKSPACE/.godot-bin"
      - run: pnpm install --frozen-lockfile
      - run: '"$GODOT_BIN" --version'
      # A clean import is part of the check: any engine or script error fails it.
      - name: Import the project
        run: |
          set -o pipefail
          pnpm godot:import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E '(SCRIPT )?ERROR:' "$RUNNER_TEMP/godot-import.log"; then exit 1; fi
      # The dependency-rule check (game/tools/check_layers.sh), then GUT.
      - run: pnpm godot:test
      # Fetches the template release asset (checksum verified), exports,
      # then content-hashes the engine and pack file names.
      - run: pnpm godot:export:web
        env:
          GH_TOKEN: ${{ github.token }}
      # Fails over the ceilings in game/tools/web_export/budget.ts
      # (docs/performance-budget.md, "Load — Godot client").
      - name: Export size (fails over the ceiling)
        run: |
          set -o pipefail
          pnpm --silent godot:size | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm godot:e2e:web
      # A measurement, not a gate: the first question under the budget's
      # throttling (10 Mbps, 150 ms RTT, 4x CPU) on a shared runner with
      # software GL swings too much to fail a merge on. Tracked in the summary.
      - name: Throttled load timer (reported, not enforced)
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm godot:load:web
          { echo '### Throttled load (10 Mbps, 150 ms RTT, 4x CPU, headless Chromium)'; echo '```json'; cat game/build/load-timing.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-web-export
          path: game/build/web
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: godot-playwright-report
          path: |
            playwright-report
            game/tests/web/playwright-report
            game/build/test-results
          if-no-files-found: ignore
          retention-days: 7
