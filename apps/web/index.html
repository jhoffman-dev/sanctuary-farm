<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sanctuary Farm</title>
    <meta name="description" content="A multiplication-fluency game — feed the animals, hatch the eggs." />
    <meta name="theme-color" content="#f3efe4" />
    <!-- All three are the same mark: favicon.svg is a copy of icon.svg.
         The SVG is declared last because Chrome takes the last icon it
         understands while Firefox and Safari prefer the SVG — declaring it
         first is how the tab and the home screen ended up with different marks. -->
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-180.png" sizes="180x180" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
